[package]
name = "openspec-visualizer"
version = "0.1.0"
description = "OpenSpec Visualizer Desktop"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openspec_visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "7"

# `tauri dev` rebuilds this crate plus its large wry/tao/objc2 dependency tree
# on every change. Full debug info (the cargo default) makes that dependency
# tree's compiled output ~2.3GB (see target/debug/deps) and is a big chunk of
# the peak RAM rustc/LLVM use while generating it. Line tables keep panic
# backtraces with file/line info; `split-debuginfo = "unpacked"` skips
# macOS's `dsymutil` post-link step, which is otherwise a separate memory-
# and time-heavy pass over that same debug info on every rebuild.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
